name: Upload Deployment Evidence Artifact

on:
  workflow_run:
    workflows: ["JARVIS DevOps CI/CD"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  collect-and-upload-evidence:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build evidence folder
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          EVIDENCE_DIR="cicd/evidence/run-${RUN_ID}"
          mkdir -p "${EVIDENCE_DIR}"
          ARTIFACTS_URL="${GH_SERVER_URL}/${REPO}/actions/runs/${RUN_ID}/artifacts"

          gh run view "${RUN_ID}" --repo "${REPO}" --log > "${EVIDENCE_DIR}/master-run.log"

          {
            echo "# Deployment Highlights"
            echo
            echo "## Docker stage"
            grep -E "(Build Docker image|Login to Docker Hub|Push Docker image|docker push)" "${EVIDENCE_DIR}/master-run.log" || echo "No Docker lines found"
            echo
            echo "## Terraform stage"
            grep -E "(Terraform Apply|terraform apply|Apply complete|Outputs:)" "${EVIDENCE_DIR}/master-run.log" || echo "No Terraform lines found"
            echo
            echo "## Kubernetes stage"
            grep -E "(Deploy to Kubernetes|kubectl apply|rollout status|successfully rolled out|deployment/jarvis-app)" "${EVIDENCE_DIR}/master-run.log" || echo "No Kubernetes lines found"
          } > "${EVIDENCE_DIR}/deployment-highlights.md"

          {
            echo "# Automated Evidence Summary"
            echo
            echo "- Workflow: ${RUN_NAME}"
            echo "- Branch: ${HEAD_BRANCH}"
            echo "- Source run URL: ${RUN_URL}"
            echo "- Source run artifacts URL: ${ARTIFACTS_URL}"
            echo "- Log file: master-run.log"
            echo "- Parsed highlights: deployment-highlights.md"
            echo "- Rubric evidence: cicd/RUBRIC_EVIDENCE.md"
          } > "${EVIDENCE_DIR}/summary.md"

          cp cicd/RUBRIC_EVIDENCE.md "${EVIDENCE_DIR}/RUBRIC_EVIDENCE.md"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence-${{ github.event.workflow_run.id }}
          path: cicd/evidence/run-${{ github.event.workflow_run.id }}
          if-no-files-found: error
