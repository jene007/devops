# yaml-language-server: disable
# cspell:words DOCKERHUB compileall chdir
name: JARVIS DevOps CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        run: npm install

      - name: Run backend tests
        run: npm test

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python checks
        run: |
          python -m compileall ai_engine intent_engine github_analyzer docker_builder k8s_deployer terraform_runner orchestrator cli self_healing monitoring

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Validate Terraform formatting and config
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets[format('{0}', 'DOCKERHUB_USERNAME')] }}/jarvis-app:${{ github.sha }} .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets[format('{0}', 'DOCKERHUB_USERNAME')] }}
          password: ${{ secrets[format('{0}', 'DOCKERHUB_TOKEN')] }}

      - name: Push Docker image
        run: |
          docker push ${{ secrets[format('{0}', 'DOCKERHUB_USERNAME')] }}/jarvis-app:${{ github.sha }}

      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets[format('{0}', 'AWS_ACCESS_KEY_ID')] }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets[format('{0}', 'AWS_SECRET_ACCESS_KEY')] }}
          AWS_DEFAULT_REGION: ${{ secrets[format('{0}', 'AWS_DEFAULT_REGION')] }}
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Configure kubectl
        env:
          KUBE_CONFIG_DATA: ${{ secrets[format('{0}', 'KUBE_CONFIG_DATA')] }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          IMAGE="${{ secrets[format('{0}', 'DOCKERHUB_USERNAME')] }}/jarvis-app:${{ github.sha }}"
          kubectl apply -f k8s/namespace.yaml
          sed "s|docker.io/your-username/jarvis-app:latest|$IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/jarvis-app -n jarvis --timeout=180s
